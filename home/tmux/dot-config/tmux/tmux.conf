# kitty sends this made-up sequence for Cmd+K; no real key sends it
# 7344 looks like "tmux": 7 is t, 3 is m turned on its side, 44 is ux
set -s user-keys[0] "\e[7344~"
set -g prefix User0
unbind C-b
# Pass Cmd+K on to a nested tmux when pressed twice
bind User0 send-keys -H 1b 5b 37 33 34 34 7e

bind t new-window -c '#{?#{m:/*,#{pane_path}},#{pane_path},#{pane_current_path}}'
bind [ previous-window
bind ] next-window
# Give swap-window a source, which would otherwise be a marked pane's window
bind , if -F '#{window_start_flag}' { move-window -a -t ':{end}' } { run-shell -C 'swap-window -s #{window_id} -t :-1'; select-window -t :-1 }
bind . if -F '#{window_end_flag}' { move-window -b -t ':{start}' } { run-shell -C 'swap-window -s #{window_id} -t :+1'; select-window -t :+1 }
# Pass the name through an option, so rename-window doesn't expand # in it
bind r command-prompt -p '(rename-window)' -I '#{E:@tab-title}' { set -w @rename '%%'; rename-window -- '#{@rename}'; set -wu @rename }
bind l { source-file ~/.config/tmux/tmux.conf; display-message 'Reloaded the config' }
# Let nvim copy through tmux, which ignores OSC 52 from popups
bind h display-popup -E -w 100% -h 100% 'tmux capture-pane -pJ -S - | env -u SSH_TTY nvim -R + -'

set -g base-index 1
set -g renumber-windows on

# Name tabs after the title the shell sets, else after the program, as automatic renaming lags
set -g @tab-title '#{?automatic-rename,#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host}}},#{pane_title},#{pane_current_command}},#{window_name}}'
# The same, with # escaped for the status line
set -g @tab-name '#{?automatic-rename,#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host}}},#{q/h:pane_title},#{q/h:pane_current_command}},#{q/h:window_name}}'
set -g set-titles on
set -g set-titles-string '#{E:@tab-title}'
# Name a tab automatically again when its name is cleared
set-hook -g after-rename-window 'if -F "#{==:#{window_name},}" "set -w automatic-rename on"'

# Leave an empty line above the tab bar
set -g status 2
# Reset first, so a reload doesn't copy the empty line
set -gu status-format
set -gF status-format[1] '#{status-format[0]}'
set -g status-format[0] ''
set -g status-style bg=default,fg=brightblack
set -g window-status-separator ''
set -g @accent '#d7d9db'
set -g @green '#90c08e'

# End the session name like a tab, with a quarter cell of gap
set -g status-left '#[bg=#{@green},fg=black] #{=21:session_name}#[fg=#{@green},bg=terminal]▊'
# Fit the longest name, as the default of 10 would cut the padding of a name over 8 characters
set -g status-left-length 23
set -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}#[bg=#{@green},fg=black] #{=21:host} '

set -g window-status-style bg=brightblack,fg=black
set -gF window-status-current-style 'bg=#{@accent},fg=black,bold'
set -g @tab-bg '#{?window_active,#{@accent},brightblack}'
# Split the gap between tabs as kitty does: an eighth of a cell starts each tab, a quarter ends it
# Draw the gap with blocks in the tab's color on terminal, as default here means the tab's color
set -g window-status-format '#[fg=#{E:@tab-bg},bg=terminal]🮋#[fg=black,bg=#{E:@tab-bg}]#I #{=/40/…:#{E:@tab-name}}#[fg=#{E:@tab-bg},bg=terminal]▊'
set -g window-status-current-format '#{E:window-status-format}'

set -s set-clipboard on
set -as terminal-features 'xterm*:hyperlinks'
set -g mouse on

# Copy the terminal's clipboard into tmux on focus, since nvim over SSH pastes from tmux
set -g focus-events on
set-hook -g client-focus-in 'refresh-client -l'
