# vim:fileencoding=utf-8:ft=conf

enable_audio_bell no
editor nvim
font_family JetBrains Mono
font_size 11
adjust_line_height 115%
# disable_ligatures cursor
disable_ligatures always
cursor_shape block
cursor_stop_blinking_after 0
scrollback_lines 2000
tab_bar_edge top
tab_bar_style separator
# Separators and padding move into the template below
tab_separator ""
# Start each tab with its separator, on the tab's color
# Put a busy tab's number on light amber, with a sliver each side
# Busy means a program reports working by OSC 7501, which kitty shows as \uf110
# Mark ssh tabs with a padlock, judged by process, not by title
# Use the oldest process, as git push runs ssh as the newest
# Also match kitten ssh, which runs ssh as a child
# Check for tab.program_status, which older kitty lacks
# Write [ as \x5b, as a literal [ breaks kitty's bell check
tab_title_template "{fmt.fg.default}{'▍' if index > 1 else ''}{fmt.fg._ffe7b7}{'\x1b\x5b7m▋\x1b\x5b27m' if (w := 'program_status' in tab.__class__.__dict__ and tab.program_status.startswith('\uf110')) else ' '}{fmt.bg._ffe7b7 if w else ''}{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}{fmt.bg.tab}{fmt.fg._ffe7b7 + '▍' + fmt.fg.tab if w else ' '}{' ' if tab.active_oldest_exe == 'ssh' or (tab.active_oldest_exe, tab.active_exe) == ('kitten', 'ssh') else ''}{tab.last_focused_progress_percent}{title} "
sync_to_monitor no
tab_bar_margin_width 0
tab_bar_margin_height 2 3
# Disable dragging to prevent tab detaches
drag_threshold 0
wheel_scroll_multiplier 3
touch_scroll_multiplier 3
notify_on_cmd_finish unfocused 30.0

# Don't wait for background processes
close_on_child_death yes

# Cmd is the macOS binding; Alt is kept because Cmd aliases to Super on Linux, where the desktop grabs it
map alt+1 goto_tab 1
map cmd+1 goto_tab 1
map alt+2 goto_tab 2
map cmd+2 goto_tab 2
map alt+3 goto_tab 3
map cmd+3 goto_tab 3
map alt+4 goto_tab 4
map cmd+4 goto_tab 4
map alt+5 goto_tab 5
map cmd+5 goto_tab 5
map alt+6 goto_tab 6
map cmd+6 goto_tab 6
map alt+7 goto_tab 7
map cmd+7 goto_tab 7
map alt+8 goto_tab 8
map cmd+8 goto_tab 8
map alt+9 goto_tab 9
map cmd+9 goto_tab 9
map alt+0 goto_tab 10
map cmd+0 goto_tab 10

# Let nvim over SSH paste the clipboard without a confirmation prompt
clipboard_control write-clipboard write-primary read-clipboard read-primary
map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard
map ctrl+shift+c send_text all \x03
map ctrl+shift+v send_text all \x16
map cmd+h launch --stdin-source=@screen_scrollback --type overlay nvim -R + -
map ctrl+shift+h launch --stdin-source=@screen_scrollback --type overlay nvim -R + -
map cmd+g launch --stdin-source=@last_cmd_output --type overlay nvim -R -
map ctrl+shift+g launch --stdin-source=@last_cmd_output --type overlay nvim -R -
# Oldest, not newest: Claude Code's lingering xclip runs in /
map cmd+t launch --type=tab --cwd=oldest
map ctrl+shift+t launch --type=tab --cwd=oldest
# Move the tab to a picked OS window; Cmd+M replaces macOS minimize
map cmd+m detach_tab ask
map ctrl+shift+m detach_tab ask
# Rename the window; R replaces interactive window resizing
map cmd+r set_window_title
map ctrl+shift+r set_window_title
# Reload the config; Cmd+L replaces clearing the last command, Ctrl+Shift+L cycling layouts
map cmd+l load_config_file
map ctrl+shift+l load_config_file
# Move tabs like Ctrl+Shift+, and .; Cmd+, replaces editing the config
map cmd+, move_tab_backward
map cmd+. move_tab_forward
# Switch tabs; Ctrl+Shift+[ and ] replace switching windows
map cmd+[ previous_tab
map ctrl+shift+[ previous_tab
map cmd+] next_tab
map ctrl+shift+] next_tab
# Send tmux's prefix; Cmd+K replaces clearing to the cursor, Ctrl+Shift+K scrolling a line up
map cmd+k send_text all \e[7344~
map ctrl+shift+k send_text all \e[7344~
# Shift+Enter to add a new line in Claude Code
map shift+enter send_text all \e\r

# Keeps theme switches out of the stowed kitty.conf
include themes.conf
